<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดรถ | ORD RAPTER</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background: linear-gradient(90deg, #d60000, #000);
      color: white;
      padding: 15px;
      text-align: center;
    }
    .car-detail {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .car-detail img {
      width: 100%;
      max-width: 500px;
      border-radius: 10px;
    }
    .car-info {
      flex: 1;
      padding: 20px;
    }
    .car-info h2 {
      color: #d60000;
      margin-bottom: 10px;
    }
    .price {
      font-size: 1.5rem;
      color: #222;
      margin-bottom: 15px;
    }
    ul {
      padding-left: 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      background: #d60000;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }
    .btn:hover {
      background: black;
    }
  </style>
</head>
<body>

<header>
  <h1>รายละเอียดรถ | ORD RAPTER</h1>
</header>

<section class="car-detail">
  <div class="car-image">
    <img src="img/1.png" alt="Echo Luxury">
  </div>
  <div class="car-info">
    <h2>Echo Luxury</h2>
    <p class="price">ราคา: 4,500,000 บาท</p>
    <h3>คุณสมบัติ:</h3>
    <ul>
      <li>เครื่องยนต์ 1.5Turbo</li>
      <li>เกียร์อัตโนมัติ 8 สปีด</li>
      <li>ภายในหนังแท้</li>
      <li>ระบบความปลอดภัย ABS + Airo(plus)</li>
    </ul>
    <a href="หน้าติดต่อ.html" class="btn">ติดต่อซื้อรถ</a>
  </div>
</section>

</body>
</html>
